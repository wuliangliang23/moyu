<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101226">
  <title>今天几点下班？</title>
  <style>
    :root {
      --ink: #f8f7ff;
      --muted: rgba(248, 247, 255, .64);
      --pink: #ff6fae;
      --purple: #8f7cff;
      --blue: #5fc9ff;
      --glass: rgba(255, 255, 255, .10);
      --line: rgba(255, 255, 255, .15);
    }
 
    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      min-height: 100svh;
      overflow: hidden;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 12% 18%, rgba(255, 111, 174, .32), transparent 28%),
        radial-gradient(circle at 88% 12%, rgba(95, 201, 255, .25), transparent 26%),
        radial-gradient(circle at 55% 90%, rgba(143, 124, 255, .30), transparent 34%),
        linear-gradient(155deg, #17142f 0%, #101226 56%, #171a3d 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: -50%;
      background-image: radial-gradient(rgba(255,255,255,.18) .8px, transparent .8px);
      background-size: 22px 22px;
      transform: rotate(10deg);
      mask-image: linear-gradient(to bottom, #000, transparent 72%);
      pointer-events: none;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(2px);
      opacity: .6;
      animation: float 8s ease-in-out infinite;
      pointer-events: none;
    }
    .orb.one { width: 84px; height: 84px; right: -20px; top: 25%; background: linear-gradient(135deg, #ff7eb3, #765cff); }
    .orb.two { width: 48px; height: 48px; left: 5%; bottom: 10%; background: linear-gradient(135deg, #50d5ff, #7a65ff); animation-delay: -3s; }

    main {
      position: relative;
      z-index: 1;
      min-height: 100svh;
      width: min(100%, 520px);
      margin: 0 auto;
      padding: calc(28px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    header { display: flex; justify-content: space-between; align-items: center; }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      box-shadow: 0 8px 28px rgba(255, 111, 174, .3);
    }

    .now { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

    .hero { margin: auto 0; padding: 36px 0 28px; }

    .mood-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .mood-emoji {
      position: relative;
      width: 82px;
      height: 82px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(255,255,255,.18), rgba(255,255,255,.06));
      box-shadow: 0 18px 45px rgba(2,3,17,.22), inset 0 1px rgba(255,255,255,.18);
      font-size: 49px;
      transform: rotate(-5deg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      animation: moodBob 2.8s ease-in-out infinite;
    }

    .mood-emoji::after {
      content: "";
      position: absolute;
      inset: auto 13px -10px;
      height: 14px;
      border-radius: 50%;
      background: rgba(0,0,0,.22);
      filter: blur(7px);
      z-index: -1;
    }

    .mood-copy { margin-left: 18px; text-align: right; }
    .mood-title { font-weight: 700; font-size: 15px; }
    .mood-note { margin-top: 5px; color: var(--muted); font-size: 12px; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 99px;
      background: rgba(255,255,255,.07);
      color: rgba(255,255,255,.82);
      font-size: 13px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #7affbd;
      box-shadow: 0 0 0 0 rgba(122,255,189,.6);
      animation: pulse 2s infinite;
    }

    h1 {
      margin: 22px 0 8px;
      font-size: clamp(30px, 9vw, 46px);
      line-height: 1.12;
      letter-spacing: -.04em;
    }

    h1 span {
      color: transparent;
      background: linear-gradient(90deg, #ff9ac6, #b7a9ff 52%, #85dcff);
      background-clip: text;
      -webkit-background-clip: text;
    }

    .subtitle { margin: 0 0 30px; color: var(--muted); font-size: 14px; }

    .countdown {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .time-card {
      position: relative;
      min-width: 0;
      padding: 22px 8px 17px;
      text-align: center;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(255,255,255,.14), rgba(255,255,255,.055));
      box-shadow: inset 0 1px rgba(255,255,255,.12), 0 18px 45px rgba(2,3,17,.20);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .time-card::after {
      content: "";
      position: absolute;
      width: 45px;
      height: 45px;
      right: -20px;
      top: -20px;
      border-radius: 50%;
      background: var(--pink);
      filter: blur(20px);
      opacity: .45;
    }

    .num {
      display: block;
      font-size: clamp(34px, 11vw, 54px);
      line-height: 1;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.05em;
      text-shadow: 0 5px 20px rgba(0,0,0,.2);
    }

    .unit { display: block; margin-top: 10px; color: var(--muted); font-size: 12px; letter-spacing: .2em; }

    .progress-wrap { margin-top: 28px; }
    .progress-label { display: flex; justify-content: space-between; margin-bottom: 10px; color: var(--muted); font-size: 12px; }
    .track { height: 7px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.10); }
    .bar {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--pink), var(--purple), var(--blue));
      box-shadow: 0 0 18px rgba(143,124,255,.7);
      transition: width .8s ease;
    }

    .quote {
      margin-top: 24px;
      min-height: 42px;
      padding: 13px 16px;
      border-left: 2px solid var(--pink);
      color: rgba(255,255,255,.76);
      font-size: 13px;
      line-height: 1.6;
      background: linear-gradient(90deg, rgba(255,111,174,.09), transparent);
    }

    footer { display: flex; justify-content: space-between; align-items: flex-end; color: rgba(255,255,255,.43); font-size: 11px; }
    .schedule { line-height: 1.8; }
    .mini-icon { font-size: 24px; animation: nod 3s ease-in-out infinite; transform-origin: bottom center; }

    @keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(122,255,189,0); } 100% { box-shadow: 0 0 0 0 rgba(122,255,189,0); } }
    @keyframes float { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-18px) rotate(12deg); } }
    @keyframes nod { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(8deg); } }
    @keyframes moodBob { 0%,100% { transform: translateY(0) rotate(-5deg); } 50% { transform: translateY(-7px) rotate(4deg); } }

    @media (max-height: 650px) {
      main { padding-top: 18px; padding-bottom: 14px; }
      .hero { padding: 22px 0 16px; }
      h1 { margin-top: 15px; }
      .subtitle { margin-bottom: 20px; }
      .time-card { padding-top: 17px; }
      .progress-wrap { margin-top: 20px; }
      .quote { margin-top: 16px; }
      .mood-row { margin-bottom: 10px; }
      .mood-emoji { width: 62px; height: 62px; border-radius: 21px; font-size: 38px; }
    }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="orb one"></div>
  <div class="orb two"></div>
  <main>
    <header>
      <div class="brand"><span class="brand-mark">✦</span><span>摸鱼计时器</span></div>
      <div class="now" id="now">--:--:--</div>
    </header>

    <section class="hero">
      <div class="mood-row">
        <div class="mood-emoji" id="moodEmoji" role="img" aria-label="当前心情">😐</div>
        <div class="mood-copy">
          <div class="mood-title" id="moodTitle">正在感受今天的心情...</div>
          <div class="mood-note" id="moodNote">心情随时间实时变化</div>
        </div>
      </div>
      <div class="eyebrow"><i class="pulse"></i><span id="status">正在读取时间...</span></div>
      <h1 id="headline">距离下班<br><span>还有一点点</span></h1>
      <p class="subtitle" id="targetText">今日 18:00 准时下班</p>

      <div class="countdown" aria-live="polite">
        <div class="time-card"><span class="num" id="hours">00</span><span class="unit">小时</span></div>
        <div class="time-card"><span class="num" id="minutes">00</span><span class="unit">分钟</span></div>
        <div class="time-card"><span class="num" id="seconds">00</span><span class="unit">秒</span></div>
      </div>

      <div class="progress-wrap">
        <div class="progress-label"><span id="progressLabel">今日工作进度</span><span id="percent">0%</span></div>
        <div class="track"><div class="bar" id="bar"></div></div>
      </div>

      <div class="quote" id="quote">认真生活，也认真期待下班。</div>
    </section>

    <footer>
      <div class="schedule">上班 08:30<br>下班 18:00</div>
      <div class="mini-icon" id="miniIcon">☕</div>
    </footer>
  </main>

  <script>
    (function () {
      var quotes = [
        "工位只是暂时的，快乐才是自己的。",
        "再坚持一下，下班后的风会很甜。",
        "今日份努力正在加载，快乐也在路上。",
        "认真生活，也认真期待下班。",
        "距离自由越来越近啦。"
      ];
      var quoteIndex = -1;

      function pad(value) { return String(value).padStart(2, "0"); }
      function atTime(date, hour, minute) {
        var result = new Date(date);
        result.setHours(hour, minute, 0, 0);
        return result;
      }

      function setMood(emoji, title, note) {
        var moodEmoji = document.getElementById("moodEmoji");
        moodEmoji.textContent = emoji;
        moodEmoji.setAttribute("aria-label", title);
        document.getElementById("moodTitle").textContent = title;
        document.getElementById("moodNote").textContent = note;
      }

      function update() {
        var now = new Date();
        var start = atTime(now, 8, 30);
        var end = atTime(now, 18, 0);
        var target, mode, progress;

        if (now < start) {
          target = start;
          mode = "before";
          progress = 0;
        } else if (now < end) {
          target = end;
          mode = "work";
          progress = (now - start) / (end - start) * 100;
        } else {
          target = atTime(new Date(now.getTime() + 86400000), 8, 30);
          mode = "after";
          progress = 100;
        }

        var distance = Math.max(0, target - now);
        var totalSeconds = Math.floor(distance / 1000);
        var hours = Math.floor(totalSeconds / 3600);
        var minutes = Math.floor((totalSeconds % 3600) / 60);
        var seconds = totalSeconds % 60;

        document.getElementById("now").textContent = pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
        document.getElementById("hours").textContent = pad(hours);
        document.getElementById("minutes").textContent = pad(minutes);
        document.getElementById("seconds").textContent = pad(seconds);
        document.getElementById("bar").style.width = Math.min(100, Math.max(0, progress)) + "%";
        document.getElementById("percent").textContent = Math.floor(progress) + "%";

        if (mode === "work") {
          document.getElementById("status").textContent = "今日营业中";
          document.getElementById("headline").innerHTML = "距离下班<br><span>还有一点点</span>";
          document.getElementById("targetText").textContent = "今日 18:00 准时下班";
          document.getElementById("progressLabel").textContent = "今日工作进度";
          document.getElementById("miniIcon").textContent = "☕";
          if (progress < 20) setMood("😩", "怎么才刚上班", "距离快乐还有一段距离");
          else if (progress < 45) setMood("😐", "保持冷静", "今日进度正在缓慢加载");
          else if (progress < 70) setMood("🙂", "看到希望了", "下班正在向你招手");
          else if (progress < 90) setMood("😄", "快乐逐渐放大", "马上就能冲出办公室");
          else setMood("🤩", "下班近在眼前！", "请提前收好快乐的心情");
        } else {
          document.getElementById("status").textContent = mode === "after" ? "下班快乐 · 自由时间" : "早安 · 还没到点";
          document.getElementById("headline").innerHTML = "距离上班<br><span>还能快乐很久</span>";
          document.getElementById("targetText").textContent = mode === "after" ? "明日 08:30 开始营业" : "今日 08:30 开始营业";
          document.getElementById("progressLabel").textContent = mode === "after" ? "今日工作已完成" : "今日工作尚未开始";
          document.getElementById("miniIcon").textContent = mode === "after" ? "🌙" : "🌤️";
          var restStart = mode === "after" ? end : atTime(new Date(now.getTime() - 86400000), 18, 0);
          var restTotal = target - restStart;
          var restLeft = Math.max(0, target - now);
          var restRatio = Math.min(1, restLeft / restTotal);
          if (restRatio > .75) setMood("🥳", "下班就是快乐", "此刻离上班还非常遥远");
          else if (restRatio > .45) setMood("😎", "自由时间进行中", "先别想工作的事情");
          else if (restRatio > .2) setMood("🙂", "假装没有明天", "快乐余额正在减少");
          else if (restRatio > .06) setMood("😟", "上班开始靠近了", "被窝正在努力挽留你");
          else setMood("😭", "不想上班！", "距离打工时间越来越近");
        }

        var nextQuote = Math.floor(now.getMinutes() / 5) % quotes.length;
        if (nextQuote !== quoteIndex) {
          quoteIndex = nextQuote;
          document.getElementById("quote").textContent = quotes[quoteIndex];
        }
      }

      update();
      setInterval(update, 1000);
    })();
  </script>
</body>
</html>
